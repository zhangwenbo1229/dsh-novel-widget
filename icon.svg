  <path d="M21.2 12.2l4.4-2.1.7 2.4-4 2.3z" fill="#ffffff"/>
  <!-- 鲸身：大圆，占画面主体 -->
  <circle cx="14.2" cy="16.6" r="11.4" fill="#ffffff"/>
  <!-- 腹部留白：左下角一小块，不吞掉身体 -->
